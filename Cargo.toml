[package]
name = "discogs-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Ergonomic, async Rust client for the Discogs API"
authors = ["Steven BOEHM"]
license = "MIT"
repository = "https://github.com/boehm-s/discogs-rs"
documentation = "https://docs.rs/discogs-client"
readme = "README.md"
keywords = ["discogs", "api", "client", "music", "vinyl"]
categories = ["api-bindings", "web-programming::http-client"]
# Keep the published package small: only what is needed to build the crate
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]

# Used by CI (`cargo nextest run --cargo-profile ci`): faster builds, still usable backtraces
[profile.ci]
inherits = "test"
debug = "line-tables-only"

# Lints
[lints.rust]
unsafe_code = "forbid"
# let_underscore_drop = "warn" false positives I think
macro_use_extern_crate = "warn"
missing_docs = "warn" # public crate: every public item must be documented
non_ascii_idents = "warn"
noop_method_call = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
# unused_qualifications = "warn" schemars generated unnecessary qualification for Box
# unused_results = "warn" so many warnings...
