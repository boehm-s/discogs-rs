# cargo-deny configuration.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Every ignored advisory must come with a justification comment
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with publishing this crate
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# The allow-list anticipates future dependencies: do not warn about licenses not used yet
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "allow"
# A published crate must not depend on `*` versions (crates.io refuses them anyway)
wildcards = "deny"
highlight = "all"
allow = []
# TLS: rustls only
deny = [
    { name = "openssl-sys" },
    { name = "native-tls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
